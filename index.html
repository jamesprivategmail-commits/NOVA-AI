<!doctype html>
<html lang="en" class="" style="background-color: #FAF9F5; color: #1F1E1D; height: 100%; margin: 0; padding: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>NOVA AI — Muse Studio</title>
    <meta name="theme-color" content="#F4EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NOVA AI" />
    <meta name="description" content="NOVA AI Muse Studio — Mature liquid-glass AI workspace with Shii, Shiia & autonomous engineering companions." />
    <meta property="og:title" content="NOVA AI — Muse Studio" />
    <meta property="og:description" content="NOVA AI Muse Studio — Mature liquid-glass AI workspace with Shii, Shiia & autonomous engineering companions." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/jpeg" href="/void-logo.jpg?v=3" />
    <link rel="apple-touch-icon" href="/void-logo.jpg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('void_ai_theme_mode');
          if (mode === 'dark') document.documentElement.classList.add('dark');
          var accent = localStorage.getItem('void_ai_accent') || 'clay';
          document.documentElement.dataset.accent = accent;
        } catch (e) {}
      })();
    </script>
    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      html.dark, html.dark body, html.dark #root, html.dark #initial-loading-view {
        background-color: #14110F !important;
        color: #F4EFE6 !important;
      }
    </style>
  </head>
  <body class="min-h-screen antialiased bg-[#F4EFE6] dark:bg-[#14110F] text-[#1F1B18] dark:text-[#F4EFE6]" style="min-height: 100vh; margin: 0; padding: 0;">
    <div id="root" class="min-h-screen">
      <div id="initial-loading-view" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100%; background-color: #F4EFE6; color: #1F1B18; padding: 24px; box-sizing: border-box; text-align: center;">
        <div style="position: relative; width: 84px; height: 84px; margin-bottom: 20px;">
          <div style="position: absolute; inset: -6px; border-radius: 24px; background: radial-gradient(circle, rgba(200, 109, 78, 0.32) 0%, transparent 72%);"></div>
          <div style="position: relative; width: 84px; height: 84px; border-radius: 22px; border: 1.5px solid rgba(200, 109, 78, 0.45); background: rgba(255, 252, 247, 0.85); box-shadow: 0 12px 32px -10px rgba(61, 45, 32, 0.25); overflow: hidden; display: flex; align-items: center; justify-content: center;">
            <img src="/void-logo.jpg?v=3" alt="NOVA AI" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.style.display='none'" />
          </div>
        </div>
        <div style="font-size: 22px; font-weight: 700; letter-spacing: 0.12em; margin-bottom: 8px;">
          NOVA AI
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.18em; color: #B85D3E; text-transform: uppercase;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background-color: #C86D4E; animation: pulseDot 1.4s infinite ease-in-out;"></span>
          Waking Muse Studio...
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
